{% extends "base.html" %}

{% block title %}Create an Account — CampusMart{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border rounded-4 p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="category-icon mb-2"><i class="bi bi-person-plus"></i></div>
                    <h4 class="fw-bold">Student Registration</h4>
                    <p class="text-muted small">Join CampusMart to buy and sell second-hand academic items</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Full Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">College Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="name@college.edu" required>
                        </div>
                        <div class="form-text">Used to log in and receive buyer inquiries.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" minlength="6" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-accent btn-lg">Create Student Account</button>
                    </div>

                    <div class="text-center small text-muted">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Log in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
